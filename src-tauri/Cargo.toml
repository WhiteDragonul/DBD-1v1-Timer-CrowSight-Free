[package]
name = "onevone-timer"
version = "1.1.0"
description = "CrowSight - 1v1 Timer - free standalone match timer overlay"
authors = ["White & Feint"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# tauri-cli enables this for production builds (tauri build) and leaves it
# off for dev (tauri dev --no-default-features). Forcing tauri/custom-protocol
# on the tauri dependency directly breaks dev mode -- the app would always
# serve frontendDist instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Auto-updater: pulls latest.json from this repo's newest GitHub Release.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Low-level keyboard + mouse hook (pass-through). Every hotkey goes through
# this rather than RegisterHotKey, so bare-key bindings (letters, digits, mouse
# buttons, scroll) don't consume the input the way global shortcuts do.
rdev = "0.5"
once_cell = "1"

# Windows-only: GetAsyncKeyState is the OS source-of-truth for whether a
# modifier key is currently held. We use it inside the low-level hook to
# avoid trusting our own shadow modifier-state, which can drift if the OS
# ever swallows a modifier-up (e.g. Alt-Tab, focus switch into a fullscreen
# game). When it drifts, bare-key hotkeys silently no-op until the user
# taps the stuck modifier again.
# Read-only API, no input consumption: preserves the pass-through guarantee.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }
